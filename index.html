<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Currency Exchange</h1>
        <p class="subtitle">Node.js + Express.js + SQLite3</p>

        <label>From Currency</label>
        <select id="fromCurrency">
            <option value="USD">USD - US Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
            <option value="INR">INR - Indian Rupee</option>
        </select>

        <label>To Currency</label>
        <select id="toCurrency">
            <option value="INR">INR - Indian Rupee</option>
            <option value="USD">USD - US Dollar</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - British Pound</option>
        </select>

        <label>Amount</label>
        <input type="number" id="amount" placeholder="Enter amount" min="0" step="0.01">

        <button onclick="convertCurrency()">Convert Currency</button>

        <div id="result" class="result"></div>

        <hr>

        <button class="secondary" onclick="showRates()">View Exchange Rates</button>
        <div id="rates" class="rates"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
